<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Bellows (3 pleats) -->
  <rect x="14.5" y="8.5" width="19" height="31" fill="#C84A3F"/>
  <g stroke="#93332B" stroke-width="2" stroke-linecap="round">
    <line x1="19.75" y1="10.5" x2="19.75" y2="37.5"/>
    <line x1="24"    y1="10.5" x2="24"    y2="37.5"/>
    <line x1="28.25" y1="10.5" x2="28.25" y2="37.5"/>
  </g>

  <!-- End panels (broader) -->
  <rect x="1.5"  y="4.5" width="14" height="39" rx="3" fill="#2C3543"/>
  <rect x="32.5" y="4.5" width="14" height="39" rx="3" fill="#2C3543"/>

  <!-- Treble buttons (left, staggered rows) -->
  <g fill="#F4EDDD">
    <circle cx="5.5"  cy="12" r="2"/>
    <circle cx="5.5"  cy="20" r="2"/>
    <circle cx="5.5"  cy="28" r="2"/>
    <circle cx="5.5"  cy="36" r="2"/>
    <circle cx="11.5" cy="16" r="2"/>
    <circle cx="11.5" cy="24" r="2"/>
    <circle cx="11.5" cy="32" r="2"/>
  </g>

  <!-- Bass buttons (right, fewer) -->
  <g fill="#F4EDDD">
    <circle cx="42.5" cy="16" r="2"/>
    <circle cx="42.5" cy="24" r="2"/>
    <circle cx="42.5" cy="32" r="2"/>
    <circle cx="36.5" cy="20" r="2"/>
    <circle cx="36.5" cy="28" r="2"/>
  </g>
</svg>
