<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="16" height="16" fill="currentColor" color="#2C3543">
  <!--
    Monochrome variant, installed as the freedesktop symbolic app icon.

    Symbolic icons are recoloured by the desktop, which injects CSS forcing
    "fill: <theme colour> !important" onto rect, circle and path elements. Anything
    drawn with a stroke keeps its own colour and comes out wrong on a dark panel, so
    the bellows pleats are filled rects with a full round cap (rx = half the height)
    rather than the stroked lines the source artwork used. The colour above is only
    the standalone fallback for viewers that do not recolour.

    This comment must stay INSIDE the root element. flatpak build-export validates
    every exported icon with gdk-pixbuf, which sniffs only a short prefix of the
    file, so a comment before <svg> pushes the root element out of that window and
    the icon is rejected with "Format not recognized", failing the release build.
    An <?xml ?> declaration does not help.
  -->

  <!-- End panels with button holes (evenodd, no mask) -->
  <path fill-rule="evenodd" d="
    M4.5,4.5 h8 a3,3 0 0 1 3,3 v33 a3,3 0 0 1 -3,3 h-8 a3,3 0 0 1 -3,-3 v-33 a3,3 0 0 1 3,-3 z
    M35.5,4.5 h8 a3,3 0 0 1 3,3 v33 a3,3 0 0 1 -3,3 h-8 a3,3 0 0 1 -3,-3 v-33 a3,3 0 0 1 3,-3 z
    M3.5,12 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M3.5,20 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M3.5,28 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M3.5,36 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M9.5,16 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M9.5,24 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M9.5,32 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M40.5,16 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M40.5,24 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M40.5,32 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M34.5,20 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
    M34.5,28 a2,2 0 1 0 4,0 a2,2 0 1 0 -4,0 z
  "/>

  <!-- Bellows: top and bottom edges, then 3 pleats -->
  <rect x="16.5" y="8.5"  width="15" height="2"  rx="1"/>
  <rect x="16.5" y="37.5" width="15" height="2"  rx="1"/>
  <rect x="18.75" y="11.5" width="2" height="25" rx="1"/>
  <rect x="23"    y="11.5" width="2" height="25" rx="1"/>
  <rect x="27.25" y="11.5" width="2" height="25" rx="1"/>
</svg>
