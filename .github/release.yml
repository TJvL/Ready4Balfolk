# Shapes what generate_release_notes produces in release.yml. Without this the notes are a flat
# "What's Changed" list in merge order, where a routine dependency bump reads exactly as loud as a
# feature.
#
# Categories match on labels, not on the commit subject, so the conventional-commit prefix does not
# place a pull request here: its labels do. Dependabot applies "dependencies" itself; the rest are
# applied by hand when the pull request is opened. The first category a label matches wins, so the
# order below is the priority order, and the catch-all has to come last.
#
# One label per pull request, chosen by what a user of the app would notice, not by the commit type:
# a fix to a test is "technical", not "bug", because no user ever met the bug. With two labels the
# priority order above picks the heading, which is how a fix came to be listed as a new feature;
# with none it lands in "Other changes".
changelog:
  categories:
    - title: New features
      labels:
        - enhancement

    - title: Fixes
      labels:
        - bug

    - title: Documentation
      labels:
        - documentation

    # Internal changes to the app itself (the audio engine, the remote, the library index) that
    # change no behaviour a user sees. Its own heading, because under "Build and CI" they read as
    # pipeline work.
    - title: Internal changes
      labels:
        - technical

    - title: Build and CI
      labels:
        - ci

    - title: Dependencies
      labels:
        - dependencies

    # Anything that reached main without a label. Left out, those pull requests would be missing
    # from the notes entirely rather than merely uncategorised.
    - title: Other changes
      labels:
        - "*"
