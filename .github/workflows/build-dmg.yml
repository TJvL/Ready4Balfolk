name: Build DMG

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Ready4Balfolk-osx-arm64
          path: download

      - name: Download generated icons
        uses: actions/download-artifact@v4
        with:
          name: generated-icons
          path: icons

      - name: Extract archive
        run: |
          mkdir -p publish
          tar -xzf download/Ready4Balfolk-osx-arm64.tar.gz -C publish

      - name: Generate .icns
        run: |
          ICONSET_DIR="AppIcon.iconset"
          mkdir -p "$ICONSET_DIR"

          cp icons/icon-16.png   "$ICONSET_DIR/icon_16x16.png"
          cp icons/icon-32.png   "$ICONSET_DIR/icon_16x16@2x.png"
          cp icons/icon-32.png   "$ICONSET_DIR/icon_32x32.png"
          cp icons/icon-64.png   "$ICONSET_DIR/icon_32x32@2x.png"
          cp icons/icon-128.png  "$ICONSET_DIR/icon_128x128.png"
          cp icons/icon-256.png  "$ICONSET_DIR/icon_128x128@2x.png"
          cp icons/icon-256.png  "$ICONSET_DIR/icon_256x256.png"
          cp icons/icon-512.png  "$ICONSET_DIR/icon_256x256@2x.png"
          cp icons/icon-512.png  "$ICONSET_DIR/icon_512x512.png"
          cp icons/icon-1024.png "$ICONSET_DIR/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET_DIR" -o AppIcon.icns

      - name: Create .app bundle
        run: |
          chmod +x packaging/macos/create-app-bundle.sh
          packaging/macos/create-app-bundle.sh publish "${{ inputs.version }}" AppIcon.icns .

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Ready4Balfolk" \
            --volicon "AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Ready4Balfolk.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "Ready4Balfolk-${{ inputs.version }}-osx-arm64.dmg" \
            "Ready4Balfolk.app"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Ready4Balfolk-osx-arm64-dmg
          path: Ready4Balfolk-*.dmg
