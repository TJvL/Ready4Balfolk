name: Build Flatpak

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  # The builder container has to carry the same runtime the manifest builds against, or the build
  # downloads a second one. Reading the version out of the manifest keeps the two from drifting:
  # there is nothing here to forget to bump, and a runtime with no matching container image fails
  # at the pull rather than quietly building against the wrong one.
  runtime-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the runtime version from the manifest
        id: read
        run: |
          set -euo pipefail
          manifest=packaging/linux/io.github.tjvl.Ready4Balfolk.yml
          version=$(sed -n 's/^runtime-version:[[:space:]]*//p' "$manifest" | tr -d "\"' ")
          if [ -z "$version" ]; then
            echo "no runtime-version in $manifest"
            exit 1
          fi
          echo "runtime version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The image below is pinned by digest, not by the floating freedesktop-<version> tag, so a
      # retagged image cannot swap out the builder that assembles the bundle a DJ installs. That
      # digest is only good for the version it was resolved from, so this catches a manifest bump
      # loudly, at the cheap step, rather than building against a tag/digest mismatch that would
      # otherwise resolve back to the manifest's declared version.
      - name: Check the pinned builder image still matches the manifest
        run: |
          set -euo pipefail
          pinned_version="25.08"
          if [ "${{ steps.read.outputs.version }}" != "$pinned_version" ]; then
            echo "packaging/linux/io.github.tjvl.Ready4Balfolk.yml now requests runtime-version ${{ steps.read.outputs.version }}, but build-flatpak.yml still pins the freedesktop-$pinned_version image digest."
            echo "Resolve the digest for freedesktop-${{ steps.read.outputs.version }} and update the pin."
            exit 1
          fi

  flatpak:
    needs: runtime-version
    runs-on: ubuntu-latest
    container:
      # ghcr.io/flathub-infra is where the action's images are published now; the older
      # bilelmoussaoui/flatpak-github-actions images on Docker Hub stop at freedesktop-24.08.
      # Pinned by digest, not the mutable freedesktop-25.08 tag: this container builds the bundle
      # a DJ installs, so a retagged image must not be able to swap that out from under the build.
      # The runtime-version job checks this digest still matches the manifest before this job starts.
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:d6975c0cabef8467b1729461c8268ac336936671db30f3f825ba0ed4de6a5425 # freedesktop-25.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Flatpak publish
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-flatpak-publish
          path: flatpak-publish

      - name: Stage Flatpak content
        run: |
          STAGE=packaging/linux/flatpak-stage

          mkdir -p $STAGE/stage/bin
          cp -r flatpak-publish/* $STAGE/stage/bin/
          chmod +x $STAGE/stage/bin/Ready4Balfolk.UI

          # Desktop file
          mkdir -p $STAGE/stage/share/applications
          cp packaging/linux/io.github.tjvl.Ready4Balfolk.desktop \
            $STAGE/stage/share/applications/

          # Icons from committed PNGs
          for size in 16 24 32 48 64 128 256 512; do
            icon="Ready4Balfolk.UI/Assets/icon-${size}.png"
            if [ -f "$icon" ]; then
              dest="$STAGE/stage/share/icons/hicolor/${size}x${size}/apps"
              mkdir -p "$dest"
              cp "$icon" "$dest/io.github.tjvl.Ready4Balfolk.png"
            fi
          done

          # Scalable icon, so shells that want a size we did not rasterise render the
          # vector instead of stretching the nearest PNG.
          mkdir -p $STAGE/stage/share/icons/hicolor/scalable/apps
          cp Ready4Balfolk.UI/Assets/icon.svg \
            $STAGE/stage/share/icons/hicolor/scalable/apps/io.github.tjvl.Ready4Balfolk.svg

          # Symbolic icon, picked up by the desktop for monochrome surfaces such as
          # notification headers and tray items, and recoloured to the theme.
          mkdir -p $STAGE/stage/share/icons/hicolor/symbolic/apps
          cp Ready4Balfolk.UI/Assets/icon-symbolic.svg \
            $STAGE/stage/share/icons/hicolor/symbolic/apps/io.github.tjvl.Ready4Balfolk-symbolic.svg

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: packaging/linux/io.github.tjvl.Ready4Balfolk.yml
          bundle: Ready4Balfolk-${{ inputs.version }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
