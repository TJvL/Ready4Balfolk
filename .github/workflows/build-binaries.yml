name: Build Binaries

# One run per branch. This publishes self-contained binaries for two platforms and launches each
# of them, so a second push while the first is going is minutes of runner time spent on a commit
# nobody will look at. Never cancelled on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

on:
  # Publishing on every pull request is not free, but it is the only way the smoke test below can
  # run before a change is merged, and a startup regression found at release time is found late.
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            artifact: Ready4Balfolk-linux-x64
          - os: windows-latest
            runtime: win-x64
            artifact: Ready4Balfolk-win-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Nothing is released from a pull request, so a pull request that runs this workflow on its
      # own passes no version at all and any value will do.
      - name: Publish (single-file)
        run: >-
          dotnet publish Ready4Balfolk.UI/Ready4Balfolk.UI.csproj
          -c Release
          -r ${{ matrix.runtime }}
          -p:Version=${{ inputs.version || '0.0.0' }}
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Publish (non-single-file for Flatpak)
        if: matrix.runtime == 'linux-x64'
        run: >-
          dotnet publish Ready4Balfolk.UI/Ready4Balfolk.UI.csproj
          -c Release
          -r linux-x64
          -p:Version=${{ inputs.version || '0.0.0' }}
          -p:PublishSingleFile=false
          -p:SelfContained=true
          -o publish-flatpak

      # Everything below this line answers the question a green build cannot: does the thing we
      # just published actually start? Directory.Build.targets takes the architecture of the BASS,
      # BASSFLAC and BASS_FX natives from the RuntimeIdentifier, but the operating system always
      # from the host, and a native that is present is not necessarily one that loads. Either way
      # the publish succeeds and produces a package that dies on launch.
      - name: Install smoke test dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # See smoke-test-packages.yml: apt-get update fails the step if any source on the runner
          # image fails, including ones nothing here installs from.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb cage libx11-6 libice6 libsm6 libfontconfig1 fonts-dejavu-core

      - name: Smoke test the portable build (Linux, X11)
        if: runner.os == 'Linux'
        run: scripts/smoke-test.sh x11 ./publish/Ready4Balfolk.UI

      - name: Smoke test the portable build (Linux, Wayland)
        if: runner.os == 'Linux'
        run: scripts/smoke-test.sh wayland ./publish/Ready4Balfolk.UI

      # The Flatpak publish differs from the portable one only in not being a single file, but that
      # single file is exactly what extracts the natives at runtime, so the two layouts can fail
      # apart. Checking it here catches that before the much slower Flatpak build.
      - name: Smoke test the Flatpak publish (Linux, X11)
        if: runner.os == 'Linux'
        run: scripts/smoke-test.sh x11 ./publish-flatpak/Ready4Balfolk.UI

      - name: Smoke test the portable build (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/smoke-test.ps1 publish/Ready4Balfolk.UI.exe
        shell: pwsh

      - name: Include icon in publish (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item Ready4Balfolk.UI/Assets/icon.ico publish/icon.ico
        shell: pwsh

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Create archive (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish
          tar -czvf ../${{ matrix.artifact }}.tar.gz *

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore
          # A release attaches these to the release page in the same run, and nothing else reads
          # them afterwards. Left at the ninety day default they were most of thirty gigabytes of
          # stored builds, and an account over its storage quota cannot upload at all: every job
          # that ends in an upload starts failing with a 403 that reads like an outage.
          retention-days: 7

      # Only the Flatpak build consumes this, and it is the callers that pass a version who go on
      # to package: the release, and the packaging checks on a pull request that touches packaging.
      # A pull request that runs this workflow on its own has nothing to feed, so it uploads
      # nothing. github.event_name is no good for the distinction: a reusable workflow called from
      # a pull request still reads pull_request, so a condition on it would starve the Flatpak job
      # of the publish it downloads.
      - name: Upload Flatpak publish
        if: matrix.runtime == 'linux-x64' && inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-flatpak-publish
          path: publish-flatpak/
          # Handed straight to the Flatpak build in the same run.
          retention-days: 7

  # A stable name for the branch ruleset to require, for the same reason verify.yml has one: the
  # matrix legs above are named after their matrix values, and a smoke test that cannot block a
  # merge is a smoke test that reports regressions rather than preventing them.
  build:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform published and started
        run: |
          if [[ "${{ needs.publish.result }}" != "success" ]]; then
            echo "The build matrix finished as: ${{ needs.publish.result }}"
            exit 1
          fi
          echo "Every platform published and its portable build started cleanly."
