name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    # Both released platforms, because the tests have to run somewhere they could fail differently:
    # Directory.Build.targets resolves the BASS natives from the host OS, and the paths the stores
    # write to are not the same shape on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Ready4Balfolk.sln

      - name: Download native dependencies
        run: dotnet build Ready4Balfolk.Domain/Ready4Balfolk.Domain.csproj -c Release --no-restore

      - name: Build Release
        run: dotnet build Ready4Balfolk.sln -c Release --no-restore

      # One platform is enough: .gitattributes normalises line endings, so the answer cannot differ.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Ready4Balfolk.sln --verify-no-changes --verbosity normal --no-restore

      - name: Run tests
        run: dotnet test Ready4Balfolk.Tests/ -c Release --no-build --verbosity normal

  # A stable name for the branch ruleset to require. A matrix reports one status check per leg,
  # named after its matrix values, so requiring those directly means editing the ruleset every time
  # the matrix changes — and a leg nobody remembered to add is a leg that cannot block a merge.
  # This job is the contract; what runs underneath it is free to change.
  verify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "The verify matrix finished as: ${{ needs.test.result }}"
            exit 1
          fi
          echo "Verify passed on every platform."
