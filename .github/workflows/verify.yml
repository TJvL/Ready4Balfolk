name: Verify

# One run per branch. A superseded push does not need its predecessor's verdict, and the matrix
# is two platforms wide. Never cancelled on main: a commit there must not be left with no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    # Both released platforms, because the tests have to run somewhere they could fail differently:
    # Directory.Build.targets resolves the BASS natives from the host OS, and the paths the stores
    # write to are not the same shape on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Keyed on the project files, so the cache turns over exactly when a dependency does.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The BASS natives are fetched from un4seen.com by Directory.Build.targets on every build,
      # which puts a third party download in the path of every run. Keyed on the targets file,
      # since that is what pins the URLs.
      - name: Cache BASS natives
        uses: actions/cache@v6
        with:
          path: build/bass-native
          key: bass-${{ runner.os }}-${{ hashFiles('Directory.Build.targets') }}

      - name: Restore
        run: dotnet restore Ready4Balfolk.sln

      - name: Download native dependencies
        run: dotnet build Ready4Balfolk.Domain/Ready4Balfolk.Domain.csproj -c Release --no-restore

      - name: Build Release
        run: dotnet build Ready4Balfolk.sln -c Release --no-restore

      # One platform is enough: .gitattributes normalises line endings, so the answer cannot differ.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Ready4Balfolk.sln --verify-no-changes --verbosity normal --no-restore

      # One platform is enough, for the same reason the formatting check runs on one.
      - name: Check translations
        if: runner.os == 'Linux'
        run: python3 scripts/check-translations.py

      # --project, not a directory: global.json opts into Microsoft.Testing.Platform, whose
      # dotnet test takes a project or a solution and rejects a bare path.
      - name: Run tests
        run: >-
          dotnet test
          --project Ready4Balfolk.Tests/Ready4Balfolk.Tests.csproj
          -c Release --no-build --verbosity normal
          --coverage --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml

      # The scenarios drive the display and the remote in a real browser, which is a download the
      # harness makes on demand the first time. Cached on the Playwright version, so it happens when
      # that changes and not once per run.
      - name: Cache the browser
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Ready4Balfolk.E2E/Ready4Balfolk.E2E.csproj') }}

      # Its own step, and one platform. These start a real application, index a real library and
      # decode real audio, so they are slow enough that a failure here must never be mistaken for a
      # failure of the fast suite, and slow enough that running them twice buys nothing: nothing a
      # scenario asserts is platform specific.
      - name: Run scenarios
        if: runner.os == 'Linux'
        run: >-
          dotnet test
          --project Ready4Balfolk.E2E/Ready4Balfolk.E2E.csproj
          -c Release --no-build --verbosity normal

      # Collected, not gated. A threshold is a policy decision and belongs in a conversation, not
      # in the first commit that measures anything; this makes the number reviewable meanwhile.
      #
      # A glob because the runner and a local run do not put the file in the same place, and
      # if-no-files-found: error because the first version of this step warned and went green while
      # uploading nothing, which is worse than not collecting coverage at all.
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: '**/TestResults/coverage.cobertura.xml'
          if-no-files-found: error

  # A stable name for the branch ruleset to require. A matrix reports one status check per leg,
  # named after its matrix values, so requiring those directly means editing the ruleset every time
  # the matrix changes — and a leg nobody remembered to add is a leg that cannot block a merge.
  # This job is the contract; what runs underneath it is free to change.
  verify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every platform passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "The verify matrix finished as: ${{ needs.test.result }}"
            exit 1
          fi
          echo "Verify passed on every platform."
