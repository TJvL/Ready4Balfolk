name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install icon tools
        run: sudo apt-get install -y librsvg2-bin icoutils

      - name: Restore
        run: dotnet restore Ready4Balfolk.sln

      - name: Check formatting
        run: dotnet format Ready4Balfolk.sln --verify-no-changes --verbosity normal --no-restore

      - name: Build Release
        run: dotnet build Ready4Balfolk.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Ready4Balfolk.Tests/ -c Release --no-build --verbosity normal
