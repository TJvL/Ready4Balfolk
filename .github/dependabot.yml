version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Minor and patch bumps arrive as one PR; a major arrives alone, so a
      # breaking framework upgrade is never hidden inside a routine batch.
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
